# Builds the Android app and runs its unit tests. The debug APK is kept as an
# artifact; it is signed with the runner's throwaway debug key, so one build
# does not install over another.
name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests, lint and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: glasshouse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
