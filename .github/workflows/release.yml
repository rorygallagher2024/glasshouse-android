# Builds the signed bundle for Play and a signed APK, on a version tag or by
# hand. A tag must match versionName in app/build.gradle.kts; it then gets a
# GitHub release with both files attached. The upload key comes from the
# repository secrets named below.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi

      - name: upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The UPLOAD_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: tests, lint, bundle and APK
        env:
          GLASSHOUSE_KEYSTORE: ${{ runner.temp }}/upload.jks
          GLASSHOUSE_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          GLASSHOUSE_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          GLASSHOUSE_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease assembleRelease

      - name: name the files after the version
        run: |
          mkdir dist
          name=glasshouse-${GITHUB_REF_NAME#v}
          [ "$GITHUB_REF_TYPE" = tag ] || name=glasshouse-${GITHUB_SHA::7}
          cp app/build/outputs/bundle/release/app-release.aab dist/$name.aab
          cp app/build/outputs/apk/release/app-release.apk dist/$name-sideload.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glasshouse-release
          path: dist/*

      # Play re-signs what it delivers with its own key, so the APK here and
      # the Play install cannot update each other; the notes say so.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: >-
            The app is on Google Play; the README says how to join the test.
            The `-sideload.apk` is for installing without Play. It is signed
            with a different key from the Play version, so neither can update
            the other: switching between them means uninstalling, which clears
            the saved TVs. The `.aab` is the bundle uploaded to Play.
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "$NOTES" --generate-notes
